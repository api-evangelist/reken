name: Reken
description: 'Reken is an AI security company building a trust layer for the Internet
  to combat generative-AI-enabled fraud, phishing, scams, deepfakes, and automated
  social engineering. Co-founded by Shuman Ghosemajumder (who founded Google''s Trust
  & Safety group) and Rich Griffiths, both formerly of Shape Security, Reken centers
  on the on-device Reken Private Core: the Reken Model Zero detection ensemble, the
  Reken Trust Sensor for verifying human activity, and an embedded Reken API that lets
  applications connect to the core while keeping data on-device with local AI models
  and zero AI token cost. Protected applications form the Reken Network, a self-assembling
  zero-trust mesh. The company is pre-launch, offering an Early Access Program; it
  does not yet publish a public developer API, SDKs, or documentation.'
